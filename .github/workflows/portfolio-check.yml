name: Portfolio check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local references
        run: python3 scripts/validate_portfolio.py
      - name: Check for accidental secret-like assignments
        run: |
          if grep -RIE '(api[_-]?key|client[_-]?secret|password)[[:space:]]*[:=][[:space:]]*[^[:space:]]+' --exclude-dir=.git .; then
            echo 'Possible secret-like assignment found.'
            exit 1
          fi

